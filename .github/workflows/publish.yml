name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish in dry-run mode
        required: true
        default: true
        type: boolean
      expected_sha:
        description: Require this exact release commit
        required: false
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected $EXPECTED_SHA, checked out $(git rev-parse HEAD)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - id: package
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag=$(node -p 'require("./package.json").publishConfig.tag')
          case "$version:$tag" in
            1.*:opencode1|2.*:latest) ;;
            *) echo "Unexpected version/channel: $version:$tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: published
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs"
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`)
          if (!response.ok && response.status !== 404) throw new Error(`npm lookup failed: ${response.status} ${response.statusText}`)
          const exists = response.ok
          if (exists) console.log(`Package ${name}@${version} is already published; skipping npm publish.`)
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${exists}\n`)
          NODE

      - if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.published.outputs.exists != 'true'
        run: npm publish --tag "${{ steps.package.outputs.tag }}"
